name: Build Windows EXE

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build executable
        run: |
          python -m PyInstaller `
            --clean `
            --onefile `
            --windowed `
            --icon="claude.ico" `
            --add-data="claude.ico;." `
            --name="Claude Chat Export" `
            claude_chat_export.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Chat-Export-Windows
          path: "dist/Claude Chat Export.exe"

      - name: Create release tag
        shell: bash
        run: |
          TAG="v1.0.${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Claude Chat Export v1.0.${{ github.run_number }}"
          body: |
            ## Claude Chat Export

            Windows executable build from commit ${{ github.sha }}.

            Download **Claude Chat Export.exe** below and run it on Windows.

            No Python installation is required.
          files: "dist/Claude Chat Export.exe"
          generate_release_notes: true
          draft: false
          prerelease: false
